<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie Photos</title>
  <style>
    /* Import de la police identique aux autres pages */
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    /* Titre principal de la page */
    .main-title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a; /* noir/gris foncé comme sur ta capture */
      margin: 40px 20px 20px;
    }

    /* Titres de sections (h2) */
    h2 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #2c3e50; /* bleu foncé/gris comme sur la capture */
      margin-top: 30px;
      margin-bottom: 15px;
    }

    /* Galerie photos */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Titre principal -->
  <h1 class="main-title">
    🎙️ Welcome to the world of the self-taught sound technician / Bienvenue dans l’univers du technicien du son autodidacte Alain Ayenan
  </h1>

  <!-- Exemple de sous-titre -->
  <h2>Mes prestations en live</h2>

  <!-- Galerie photos -->
  <div class="gallery">
    <img src="photo1.jpg" alt="Prestation 1">
    <img src="photo2.jpg" alt="Prestation 2">
    <img src="photo3.jpg" alt="Prestation 3">
    <img src="photo4.jpg" alt="Prestation 4">
  </div>

  <h2>Travaux en studio</h2>
  <div class="gallery">
    <img src="studio1.jpg" alt="Studio 1">
    <img src="studio2.jpg" alt="Studio 2">
    <img src="studio3.jpg" alt="Studio 3">
  </div>

</body>
</html>
